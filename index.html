<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description" content="王湉甜的产品、AI 与运营作品集" />
    <title>王湉甜｜产品与运营作品集</title>
  </head>
  <body class="home-page">
    <header class="site-header">
      <a class="brand" href="./index.html">WTT / PORTFOLIO</a>
      <div class="tabs header-tabs" role="tablist" aria-label="作品类型">
        <button
          class="is-active"
          data-section="projects"
          role="tab"
          aria-selected="true"
        >
          项目经历 / Projects</button
        ><button data-section="operations" role="tab" aria-selected="false">
          运营经历 / Operations
        </button>
      </div>
      <a
        class="resume-link"
        href="#"
        aria-disabled="true"
        aria-label="简历将在公开信息复核后提供"
        >简历 / Resume</a
      >
    </header>
    <main class="home-stage">
      <section class="work" aria-label="作品展示">
        <div data-slide aria-live="polite"></div>
        <div class="controls" aria-label="案例翻页">
          <button data-previous aria-label="上一个案例">←</button
          ><button data-next aria-label="下一个案例">→</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
