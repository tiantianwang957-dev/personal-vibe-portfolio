name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4
      - name: Setup Node / 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install / 安装依赖
        run: npm ci
      - name: Test / 运行测试
        run: npm test
      - name: Build / 生产构建
        run: npm run build
      - name: Setup Pages / 配置页面
        uses: actions/configure-pages@v5
      - name: Upload artifact / 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy / 发布页面
        id: deployment
        uses: actions/deploy-pages@v4
